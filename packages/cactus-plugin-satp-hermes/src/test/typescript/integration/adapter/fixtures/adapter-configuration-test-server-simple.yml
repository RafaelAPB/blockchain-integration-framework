# Simple adapter configuration using local test server
# Uses localhost:9223 endpoints from adapter-test-server.ts
# Reduced timeouts: 1 second for outbound, 3 seconds for inbound
adapters:
  - id: "phase0-adapter-1"
    name: "Transfer Validation Webhook"
    description: "Validates transfer initiation request"
    executionPoints:
      - stage: 0
        step: checkNewSessionRequest
        point: "before"
      - stage: 0
        step: checkPreSATPTransferRequest
        point: "before"
    outboundWebhook:
      url: "http://localhost:9223/webhook/outbound"
      timeoutMs: 5000
      retryAttempts: 3
      retryDelayMs: 500
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-API-Version: "v1"
      payloadTemplate: |
        {
          "phase": 0,
          "contextId": "{{.contextID}}",
          "sourceAsset": {{.sourceAsset | toJson}},
          "timestamp": "{{.timestamp}}"
        }
    inboundWebhook:
      urlSuffix: "/inbound/phase0-adapter-1"
      timeoutMs: 3000
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-API-Version: "v1"
      payloadTemplate: |
        {
          "phase": 0,
          "contextId": "{{.contextID}}",
          "sourceAsset": {{.sourceAsset | toJson}},
          "timestamp": "{{.timestamp}}"
        }
    active: true
    priority: 1

  - id: "phase0-adapter-2"
    name: "Business dashboard Webhook"
    description: "Updates legacy business dashboard with transfer data"
    executionPoints:
      - stage: 0
        step: newSessionResponse
        point: "after"
      - stage: 0
        step: preSATPTransferResponse
        point: "after"
    outboundWebhook:
      url: "http://localhost:9223/webhook/outbound/approve"
      timeoutMs: 5000
      retryAttempts: 2
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-API-Version: "v1"
      payloadTemplate: |
        {
          "phase": 0,
          "contextId": "{{.contextID}}",
          "event": "dashboard-update"
        }
    active: true
    priority: 2

  - id: "stage1-compliance-adapter"
    name: "Compliance Check Webhook"
    description: "Performs compliance checks during transfer proposal"
    executionPoints:
      - stage: 1
        step: checkTransferProposalRequestMessage
        point: "before"
      - stage: 1
        step: checkTransferCommenceRequestMessage
        point: "before"
    outboundWebhook:
      url: "http://localhost:9223/webhook/outbound"
      timeoutMs: 5000
      retryAttempts: 2
      retryDelayMs: 500
      method: "POST"
      headers:
        Content-Type: "application/json"
    inboundWebhook:
      urlSuffix: "/inbound/compliance"
      timeoutMs: 3000
    active: true
    priority: 1

  - id: "stage2-lock-monitor"
    name: "Asset Lock Monitor"
    description: "Monitors asset locking operations"
    executionPoints:
      - stage: 2
        step: checkLockAssertionRequest
        point: "after"
      - stage: 2
        step: checkLockAssertionResponse
        point: "after"
    outboundWebhook:
      url: "http://localhost:9223/webhook/outbound"
      timeoutMs: 5000
      retryAttempts: 3
      method: "POST"
      headers:
        Content-Type: "application/json"
    active: true
    priority: 1

  - id: "stage3-finalization-adapter"
    name: "Transfer Finalization Webhook"
    description: "Handles final transfer completion notifications"
    executionPoints:
      - stage: 3
        step: commitReadyResponse
        point: "after"
      - stage: 3
        step: transferCompleteResponse
        point: "after"
      - stage: 3
        step: checkTransferCompleteResponse
        point: "after"
    outboundWebhook:
      url: "http://localhost:9223/webhook/outbound"
      timeoutMs: 5000
      retryAttempts: 3
      retryDelayMs: 500
      method: "POST"
      headers:
        Content-Type: "application/json"
    active: true
    priority: 1

# Global configuration
global:
  timeoutMs: 5000
  retryAttempts: 3
  retryDelayMs: 500
  logLevel: "debug"
