# Adapter configuration for newSessionRequest step using local test server
# Uses localhost:9223 endpoints from adapter-test-server.ts
# Reduced timeouts: 1 second for outbound, 3 seconds for inbound
adapters:
  - id: "newSessionRequest-outbound-validator"
    name: "New Session Request Validator"
    description: "Validates new session request before processing"
    executionPoints:
      - stage: 0
        step: newSessionRequest
        point: "before"
    outboundWebhook:
      url: "http://localhost:9223/webhook/outbound"
      method: "POST"
      timeoutMs: 5000
      retryAttempts: 3
      retryDelayMs: 500
      headers:
        Content-Type: "application/json"
        X-API-Version: "v1"
    active: true
    priority: 1

  - id: "newSessionRequest-inbound-approval"
    name: "New Session Request Approval"
    description: "Awaits external approval after session request processing"
    executionPoints:
      - stage: 0
        step: newSessionRequest
        point: "after"
    inboundWebhook:
      urlSuffix: "/inbound/newSessionRequest-approval"
      timeoutMs: 3000
      method: "POST"
      headers:
        Content-Type: "application/json"
    active: true
    priority: 2

# Global configuration
global:
  timeoutMs: 5000
  retryAttempts: 3
  retryDelayMs: 500
  logLevel: "debug"
