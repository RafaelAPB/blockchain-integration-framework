syntax = "proto3";
package cacti.satp.v13.common;

// ── Status ──────────────────────────────────────────────

enum STATUS {
  STATUS_UNSPECIFIED = 0;
  STATUS_OK = 1;
  STATUS_ERROR = 2;
}

// ── Transfer Initialization Claim (v13 Section 8.1) ────
// Restructured: 6 fields removed, 5 renamed, 6 added = 18 total.

message TransferClaims {
    string digital_asset_id = 1;                                  // REQUIRED
    string asset_profile_id = 2;                                  // REQUIRED
    string verified_originator_entity_id = 3;                     // REQUIRED
    string verified_beneficiary_entity_id = 4;                    // REQUIRED
    string originator_public_key = 5;                             // REQUIRED — renamed from originator_pubkey
    string beneficiary_public_key = 6;                            // REQUIRED — renamed from beneficiary_pubkey
    string sender_gateway_network_id = 7;                         // REQUIRED
    string recipient_gateway_network_id = 8;                      // REQUIRED
    string sender_gateway_signature_public_key = 9;               // REQUIRED — renamed from client_gateway_pubkey
    string receiver_gateway_signature_public_key = 10;            // REQUIRED — renamed from server_gateway_pubkey
    string sender_gateway_owner_id = 11;                          // OPTIONAL
    string receiver_gateway_owner_id = 12;                        // OPTIONAL
    // v02 fields 13–18 removed: max_retries, max_timeout, amount_from_originator,
    // amount_to_beneficiary, process_policies, merge_policies
    LockType network_lock_type = 13;                              // NEW v13 — REQUIRED
    uint64 asset_lock_expiration_time = 14;                       // NEW v13 — OPTIONAL (seconds)
    string sender_gateway_id = 15;                                // NEW v13 — REQUIRED
    string recipient_gateway_id = 16;                             // NEW v13 — REQUIRED
    string sender_gateway_device_identity_public_key = 17;        // NEW v13 — OPTIONAL
    string receiver_gateway_device_identity_public_key = 18;      // NEW v13 — OPTIONAL
}

message TransferClaimsFormat {
    // v13 default value: "TRANSFER_INIT_CLAIM_FORMAT_1"
    ClaimFormat format = 1;
}

// ── Network Capabilities (v13 Section 8.2) ─────────────
// Reduced from 13 fields to 5. Signature algorithms now use
// IANA JWA registry strings (e.g. "ES256") instead of enums.

message NetworkCapabilities {
    string gateway_default_signature_algorithm = 1;               // REQUIRED — e.g. "ES256"
    repeated string gateway_supported_signature_algorithms = 2;   // OPTIONAL
    LockType network_lock_type = 3;                               // REQUIRED
    uint64 network_lock_expiration_time = 4;                      // REQUIRED
    string gateway_tls_scheme = 5;                                // NEW v13 — REQUIRED
}

// ── Message Types (v13 Section 13.3–13.4, IANA URNs) ───
// Enum values preserve v02 numbering for backward-compatible
// deserialization. New v13 types appended at the end.

enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;
    // Stage 0 — non-standard extension (v13 Section 7)
    MESSAGE_TYPE_PRE_INIT_PROPOSAL = 1;
    MESSAGE_TYPE_PRE_INIT_RECEIPT = 2;
    MESSAGE_TYPE_PRE_INIT_REJECT = 3;
    MESSAGE_TYPE_PRE_TRANSFER_COMMENCE_REQUEST = 4;
    MESSAGE_TYPE_PRE_TRANSFER_COMMENCE_RESPONSE = 5;
    // Stage 1 — v13 Sections 8.3–8.7
    MESSAGE_TYPE_INIT_PROPOSAL = 6;                     // urn:ietf:satp:msgtype:transfer-proposal-msg
    MESSAGE_TYPE_INIT_RECEIPT = 7;                      // urn:ietf:satp:msgtype:proposal-receipt-msg
    MESSAGE_TYPE_INIT_REJECT = 8;                       // urn:ietf:satp:msgtype:reject-msg (generalized)
    MESSAGE_TYPE_TRANSFER_COMMENCE_REQUEST = 9;         // urn:ietf:satp:msgtype:transfer-commence-msg
    MESSAGE_TYPE_TRANSFER_COMMENCE_RESPONSE = 10;       // urn:ietf:satp:msgtype:ack-commence-msg
    // Stage 2 — v13 Sections 9.1–9.2
    MESSAGE_TYPE_LOCK_ASSERT = 11;                      // urn:ietf:satp:msgtype:lock-assert-msg
    MESSAGE_TYPE_ASSERTION_RECEIPT = 12;                 // urn:ietf:satp:msgtype:assertion-receipt-msg
    // Stage 3 — v13 Sections 10.1–10.5
    MESSAGE_TYPE_COMMIT_PREPARE = 13;                   // urn:ietf:satp:msgtype:commit-prepare-msg
    MESSAGE_TYPE_COMMIT_READY = 14;                     // urn:ietf:satp:msgtype:commit-ready-msg
    MESSAGE_TYPE_COMMIT_FINAL = 15;                     // urn:ietf:satp:msgtype:commit-final-msg
    MESSAGE_TYPE_ACK_COMMIT_FINAL = 16;                 // urn:ietf:satp:msgtype:ack-commit-final-msg
    MESSAGE_TYPE_COMMIT_TRANSFER_COMPLETE = 17;         // urn:ietf:satp:msgtype:commit-transfer-complete-msg
    // Stage 0 — non-standard extension
    MESSAGE_TYPE_NEW_SESSION_REQUEST = 18;
    MESSAGE_TYPE_NEW_SESSION_RESPONSE = 19;
    MESSAGE_TYPE_PRE_SATP_TRANSFER_REQUEST = 20;
    MESSAGE_TYPE_PRE_SATP_TRANSFER_RESPONSE = 21;
    MESSAGE_TYPE_COMMIT_TRANSFER_COMPLETE_RESPONSE = 22;
    // NEW in v13 — Sections 10.6–10.7
    MESSAGE_TYPE_ERROR = 23;                            // urn:ietf:satp:msgtype:error-msg
    MESSAGE_TYPE_SESSION_ABORT = 24;                    // urn:ietf:satp:msgtype:session-abort-msg
}

// ── Common SATP Envelope (v13 Section 5.3) ─────────────
// Reduced from 15 fields (v02) to 4 core fields.
// Per-message fields (hashPrevMessage, hashTransferInitClaim,
// timestamp) are now in individual message definitions.

message CommonSatp {
    string version = 1;                 // REQUIRED — "1.0" (major.minor format)
    MessageType message_type = 2;       // REQUIRED
    string session_id = 3;              // REQUIRED
    string transfer_context_id = 4;     // REQUIRED (was effectively optional in v02)
    // Removed in v13: sequence_number (5), resource_url (6),
    // action_response (8), credential_block (10),
    // payload_profile (11), payload (13), payload_hash (14),
    // client_gateway_pubkey (15), server_gateway_pubkey (16),
    // hash_previous_message (17), error (18), error_code (19)
}

// ── Generic Protocol Messages (v13) ────────────────────

// v13 Section 8.5 — Reject Message
// Generic rejection that can be sent at any stage.
// Causes immediate session termination.
message RejectMessage {
    CommonSatp common = 1;
    string hash_prev_message = 2;       // SHA-256 hash of last received message
    string reason_code = 3;             // IANA error code (e.g. "err_2.1")
    string timestamp = 4;              // REQUIRED
}

// v13 Section 10.6 — Error Message
message ErrorMessage {
    CommonSatp common = 1;
    string error_msg_type = 2;          // The previous msg-type that was erroneous
    string error_type = 3;              // Error code from v13 Section 14
    string error_severity = 4;          // Severity level leading to action
}

// v13 Section 10.7 — Session Abort Message
message SessionAbortMessage {
    CommonSatp common = 1;
}

// ── Lock Types (v13 Section 8.1) ───────────────────────
// Reduced from 6 lock types (v02) to 3 in v13.
// FAUCET, MULTICLAIM, DESTROYBURN removed.

enum LockType {
    LOCK_TYPE_UNSPECIFIED = 0;
    LOCK_TYPE_TIME_LOCK = 1;            // renamed from LOCK_TYPE_TIMELOCK
    LOCK_TYPE_HASH_LOCK = 2;            // renamed from LOCK_TYPE_HASHLOCK
    LOCK_TYPE_HASH_TIME_LOCK = 3;       // renamed from LOCK_TYPE_HASHLOCKTIME
}

// ── Claim Formats ──────────────────────────────────────

enum ClaimFormat {
    CLAIM_FORMAT_UNSPECIFIED = 0;
    CLAIM_FORMAT_DEFAULT = 1;
    CLAIM_FORMAT_BUNGEE = 2;
}

message WrapAssertionClaimFormat {
    ClaimFormat format = 1;
}

message LockAssertionClaimFormat {
    ClaimFormat format = 1;
}

message MintAssertionClaimFormat {
    ClaimFormat format = 1;
}

message BurnAssertionClaimFormat {
    ClaimFormat format = 1;
}

message AssignmentAssertionClaimFormat {
    ClaimFormat format = 1;
}

// ── Assertion Claims ───────────────────────────────────

message LockAssertionClaim {
    string receipt = 1;
    string proof = 2;
    string signature = 3;
}

message MintAssertionClaim {
    string receipt = 1;
    string proof = 2;
    string signature = 3;
}

message BurnAssertionClaim {
    string receipt = 1;
    string proof = 2;
    string signature = 3;
}

message AssignmentAssertionClaim {
    string receipt = 1;
    string proof = 2;
    string signature = 3;
}

message WrapAssertionClaim {
    string receipt = 1;
    string proof = 2;
    string signature = 3;
}

// ── Token Types ────────────────────────────────────────

enum TokenType {
    TOKEN_TYPE_UNSPECIFIED = 0;
    TOKEN_TYPE_NONSTANDARD_FUNGIBLE = 1;
    TOKEN_TYPE_NONSTANDARD_NONFUNGIBLE = 2;
}

// ── Asset (used by Stage 0 extension) ──────────────────

message Asset {
    string token_id = 1;
    string reference_id = 2;
    TokenType token_type = 3;
    string owner = 4;
    uint64 amount = 5;
    string contract_name = 6;
    string contract_address = 7;    // Besu
    string msp_id = 8;             // Fabric
    string channel_name = 9;       // Fabric
    NetworkId network_id = 10;
    ERCTokenStandard erc_token_standard = 11;
}

message NetworkId {
    string id = 1;
    string type = 2;
}

enum ERCTokenStandard {
    ERC_TOKEN_STANDARD_UNSPECIFIED = 0;
    ERC_TOKEN_STANDARD_ERC20 = 1;
    ERC_TOKEN_STANDARD_ERC721 = 2;
    ERC_TOKEN_STANDARD_ERC1155 = 3;
}

// ── Asset Profile (retained for internal session data) ──
// Not part of v13 wire protocol; asset is referenced only
// by assetProfileId in TransferClaims.

message AssetProfile {
    string issuer = 1;
    string asset_code = 2;
    string asset_code_type = 3;
    string issuance_date = 4;
    string expiration_date = 5;
    string verification_end_point = 6;
    string digital_signature = 7;
    string prospectus_link = 8;
    repeated string key_information_link = 9;
    repeated string keywords = 10;
    repeated string transfer_restrictions = 11;
    repeated string ledger_requirements = 12;
}
