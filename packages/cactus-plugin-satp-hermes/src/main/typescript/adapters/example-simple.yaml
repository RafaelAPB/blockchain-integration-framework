satpStages:
  stage0:
    adapters:
      - id: "phase0-adapter-1"
        name: "Transfer Validation Webhook"
        description: "Validates transfer initiation request"
        outboundWebhook:
          url: "https://webhook.phase0.omnumi.com/validate"
          timeoutMs: 5000
          retryAttempts: 3
          retryDelayMs: 1000
        # if defined, the transaction will be automatically paused in SATP 
        # until the inboundWebhook has been called for the specific contextId
        inboundWebhook:
          urlSuffix: "/inbound/phase0-adapter-1"
          timeoutMs: 300000   # 5 minutes, if not called by then, transaction is cancelled
        active: true
        priority: 1
      - id: "phase0-adapter-2"
        name: "Business dashboard Webhook"
        description: "Updated some business dashboard with a value"
        outboundWebhook:
          url: "https://bd.phase0.omnumi.com/inform"
          timeoutMs: 3000
          retryAttempts: 2
        active: true
        priority: 2
# Global configuration
global:
  timeoutMs: 3000
  retryAttempts: 5
  retryDelayMs: 500
  logLevel: "info"
