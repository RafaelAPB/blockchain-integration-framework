adapters:
  - id: "phase0-adapter-1"
    name: "Transfer Validation Webhook"
    description: "Validates transfer initiation request"
    executionPoints:
      - name: "validate new session request - server"
        stage: 0
        step: checkNewSessionRequest
        point: "before"
      - name: "validate pre-SATP transfer - server"
        stage: 0
        step: checkPreSATPTransferRequest
        point: "before"
    outboundWebhook:
      url: "https://webhook.phase0.omnumi.com/validate"
      timeoutMs: 5000
      retryAttempts: 3
      retryDelayMs: 1000
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-API-Version: "v1"
      payloadTemplate: |
        {
          "phase": 0,
          "contextId": "{{.contextID}}",
          "sourceAsset": {{.sourceAsset | toJson}},
          "timestamp": "{{.timestamp}}"
        }
    # if defined, the transaction will be automatically paused in SATP 
    # until the inboundWebhook has been called for the specific contextId
    inboundWebhook:
      urlSuffix: "/inbound/phase0-adapter-1"
      timeoutMs: 300000   # 5 minutes, if not called by then, transaction is cancelled
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-API-Version: "v1"
      payloadTemplate: |
        {
          "phase": 0,
          "contextId": "{{.contextID}}",
          "sourceAsset": {{.sourceAsset | toJson}},
          "timestamp": "{{.timestamp}}"
        }
    active: true
    priority: 1

  - id: "phase0-adapter-2"
    name: "Business dashboard Webhook"
    description: "Updates legacy business dashboard with transfer data"
    executionPoints:
      - name: "notify dashboard after session created - server"
        stage: 0
        step: newSessionResponse
        point: "after"
      - name: "notify dashboard after pre-SATP transfer - server"
        stage: 0
        step: preSATPTransferResponse
        point: "after"
    outboundWebhook:
      url: "https://bd.phase0.omnumi.com/inform"
      timeoutMs: 3000
      retryAttempts: 2
      method: "POST"
      headers:
        Content-Type: "application/xml"
        X-API-Version: "v1"
        X-Data-Format: "xml"
      payloadTemplate: |
        <?xml version="1.0" encoding="UTF-8"?>
        <BusinessDashboardUpdate>
          <Phase>0</Phase>
          <Transaction>
            <ContextId>{{.contextID}}</ContextId>
            <SourceAsset>
              <Id>{{.sourceAsset.id}}</Id>
              <ReferenceId>{{.sourceAsset.referenceId}}</ReferenceId>
            </SourceAsset>
          </Transaction>
        </BusinessDashboardUpdate>
    active: true
    priority: 2

  - id: "stage1-compliance-adapter"
    name: "Compliance Check Webhook"
    description: "Performs compliance checks during transfer proposal"
    executionPoints:
      - name: "compliance check on transfer proposal - server"
        stage: 1
        step: checkTransferProposalRequestMessage
        point: "before"
      - name: "compliance check on transfer commence - server"
        stage: 1
        step: checkTransferCommenceRequestMessage
        point: "before"
    outboundWebhook:
      url: "https://compliance.omnumi.com/check"
      timeoutMs: 10000
      retryAttempts: 2
      retryDelayMs: 2000
      method: "POST"
      headers:
        Content-Type: "application/json"
    inboundWebhook:
      urlSuffix: "/inbound/compliance"
      timeoutMs: 600000   # 10 minutes for manual compliance review
    active: true
    priority: 1

  - id: "stage2-lock-monitor"
    name: "Asset Lock Monitor"
    description: "Monitors asset locking operations"
    executionPoints:
      - name: "monitor lock assertion - server"
        stage: 2
        step: checkLockAssertionRequest
        point: "after"
      - name: "monitor lock response - client"
        stage: 2
        step: checkLockAssertionResponse
        point: "after"
    outboundWebhook:
      url: "https://monitor.omnumi.com/lock-events"
      timeoutMs: 3000
      retryAttempts: 3
      method: "POST"
      headers:
        Content-Type: "application/json"
    active: true
    priority: 1

  - id: "stage3-finalization-adapter"
    name: "Transfer Finalization Webhook"
    description: "Handles final transfer completion notifications"
    executionPoints:
      - name: "notify on commit ready - server"
        stage: 3
        step: commitReadyResponse
        point: "after"
      - name: "notify on transfer complete - server"
        stage: 3
        step: transferCompleteResponse
        point: "after"
      - name: "notify on transfer complete - client"
        stage: 3
        step: checkTransferCompleteResponse
        point: "after"
    outboundWebhook:
      url: "https://finalization.omnumi.com/complete"
      timeoutMs: 5000
      retryAttempts: 3
      retryDelayMs: 1000
      method: "POST"
      headers:
        Content-Type: "application/json"
    active: true
    priority: 1

# Global configuration
global:
  timeoutMs: 3000
  retryAttempts: 5
  retryDelayMs: 500
  logLevel: "info"

